<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover so the terminal reaches under a notch and the key
         bar can pad itself with env(safe-area-inset-bottom) instead.
         interactive-widget=resizes-content is the third line of defence for the
         software keyboard: browsers that honour it shrink the layout viewport
         themselves, which mobile.js then measures as no inset at all, so the
         two do not double up. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Sip</title>
    <link rel="stylesheet" href="static/xterm.css">
    <link rel="stylesheet" href="static/webterm.css">
    <link rel="stylesheet" href="static/terminal.css">
    <link rel="preload" href="static/fonts/JetBrainsMonoNerdFontMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="static/fonts/JetBrainsMonoNerdFontMono-Bold.ttf" as="font" type="font/ttf" crossorigin>
    {{FONT_FACE_EXTRA}}
</head>
<body>
    <div id="terminal-container">
        <div id="terminal" class="webterm"></div>
    </div>
    <div id="connection-status">
        <span id="status-icon">●</span>
        <span id="status-text">Loading…</span>
    </div>
    <!-- U+F013, the Font Awesome cog the bundled Nerd Font patches in. Not
         U+2699: that one is not in the font at all, so it fell through to
         whatever the system had and came out as a colour emoji. Draggable on a
         desktop and folded into the key bar on touch; see mobile.js. -->
    <button id="settings-toggle" title="Settings" aria-label="Settings">&#xF013;</button>
    <div id="settings-panel" class="hidden">
        <h3>Settings</h3>
        <div class="setting-group">
            <label>Transport</label>
            <select id="transport-select">
                <option value="auto">Auto (prefer QUIC)</option>
                <option value="webtransport">WebTransport (QUIC)</option>
                <option value="websocket">WebSocket</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Renderer</label>
            <select id="renderer-select">
                <option value="auto">Auto (prefer WebGL)</option>
                <option value="webgl">WebGL</option>
                <option value="canvas">Canvas</option>
                <option value="dom">DOM</option>
                <option value="vtgl">vtgl (experimental)</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Font Size</label>
            <input type="range" id="font-size" min="10" max="28" value="14">
            <span id="font-size-value">14px</span>
        </div>
        <div class="setting-group">
            <label><input type="checkbox" id="copy-on-select"> Copy on select</label>
            <label><input type="checkbox" id="cursor-blink"> Blink cursor</label>
            <label><input type="checkbox" id="browser-context-menu"> Browser right-click menu (shift always shows it)</label>
            <label><input type="checkbox" id="capture-reserved-keys"> Capture Ctrl+W and friends (fullscreen only)</label>
        </div>
        <div class="setting-info">
            <div id="renderer-info">Renderer: detecting…</div>
            <div id="transport-info">Transport: detecting…</div>
        </div>
        <button id="settings-apply" class="primary">Apply &amp; Reconnect</button>
        <button id="settings-close">Close</button>
    </div>
    <script src="static/webterm.js"></script>
    <script src="static/mobile.js"></script>
    <script src="static/terminal.js"></script>
</body>
</html>
